[project]
name = "docling-rag"
version = "0.1.0"
description = "Local RAG system using Docling for document parsing and ChromaDB for vector storage"
readme = "README.md"
authors = [
    { name = "Nikolai Stein", email = "nikolai.stein86@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling",
    "chromadb",
    "transformers",
    "sentence-transformers",
    "curl-cffi>=0.14.0",
]

[project.scripts]
docling-rag = "docling_rag.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
